body {
    font-family: Arial, sans-serif;
    background-color: #f9f9f9;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
}

.button-container {
    display: flex;
    gap: 20px;
}

.social-button img {
    width: 60px;
    height: 60px;
    border-radius: 50%;
    box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
    transition: transform 0.3s ease, box-shadow 0.3s ease;
}

.social-button img:hover {
    transform: scale(1.1);

}

 
        .card {
           display: flex;
           width: 1000px;
           height: 500px;
           background-color: #f4f4f4;
           border-radius: 10px;
           box-shadow: 0px 2px 4px rgba(0,0,0,1);
           overflow: hidden;
           transition: transform 0.6s ease;
         }
         .card:hover {
           transform: translateY(-20px);
         }

         .card video {
           width: 50%;
           height: auto;
           object-fit: cover;
           border: 2px black;
        }

        .card-content {
           padding: 20px;
        }
        .card-content h1{
           font-size: 24px;
           margin-bottom: 10px;
           text-align: center;
           top: 35%;
            left: 30%;
            background: linear-gradient(90deg,
            #ff0000,
            #ffff00,
            #ff00f3, #0033ff,
            #ff00c4, #ff0000);
            background-size: 400%;
            font-size: 45px;
            font-family: Arial, sans-serif;
            word-spacing: 5px;
            -webkit-text-fill-color: transparent;
            -webkit-background-clip: text;
            animation: animate 10s linear infinite;
        }
        @keyframes animate{
            0%{
                background-position: 0%;
            }
            100%{
                background-position: 400%;
            }

        }

        .card-content h2 {
            font-size: 24px;
            margin-bottom: 10px;
        }

        .card-content p{
           font-size: 15px;
           color: #666;
           margin-bottom: 20px;
           text-indent: 20px;
        }
        .card-content ul {
           font-size: 15px;
           margin-bottom: 15px;
        }

   </style>
