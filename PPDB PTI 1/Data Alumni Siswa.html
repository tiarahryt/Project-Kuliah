  <style>
    /* Reset dasar */
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
    }

    /* Container */
    .container {
      max-width: 1200px;
      margin: 20px auto;
      padding: 20px;
      background: #fff;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      border-radius: 8px;
    }

    /* Header */
    h1 {
      text-align: center;
      color: #4a148c;
      margin-bottom: 20px;
    }

    /* Tabel */
    table {
      width: 100%;
      border-collapse: collapse;
      border: 1px solid #ddd;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    }

    th,
    td {
      border: 1px solid #ddd;
      text-align: center;
      padding: 10px;
    }

    th {
      background-color: #7b1fa2;
      color: white;
    }

    tr:nth-child(even) {
      background-color: #f9f9f9;
    }

    tr:hover {
      background-color: #e1bee7;
    }

    button {
      background-color: #7b1fa2;
      color: white;
      border: none;
      padding: 8px 12px;
      border-radius: 4px;
      cursor: pointer;
    }

    button:hover {
      background-color: #6a1b9a;
    }

    /* Modal dan Overlay */
    .overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5);
      z-index: 999;
    }

    .modal {
      display: none;
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: #fff;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
      z-index: 1000;
      max-width: 500px;
      width: 90%;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .modal-header h2 {
      color: #4a148c;
    }

    .btn-close {
      background-color: #f44336;
      color: white;
      border: none;
      padding: 8px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 14px;
      line-height: 1;
    }

    .btn-close:hover {
      background-color: #d32f2f;
    }

    .modal table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }

    .modal th,
    .modal td {
      border: 1px solid #ddd;
      text-align: center;
      padding: 8px;
    }

    .modal th {
      background-color: #7b1fa2;
      color: white;
    }

    .modal-footer {
      margin-top: 10px;
      text-align: center;
    }
  </style>
</head>

    // Menampilkan hasil ujian
    function showNilai(nama, nilai) {
      const modal = document.getElementById("modal");
      const overlay = document.getElementById("overlay");
      const hasilDiv = document.getElementById("hasilUjian");
      const rataRataEl = document.getElementById("rataRata");

      let totalNilai = 0;
      let html = `<p>Nama: ${nama}</p><table><thead><tr><th>Mata Pelajaran</th><th>Nilai</th></tr></thead><tbody>`;
      nilai.forEach((n) => {
        html += `<tr><td>${n.mataPelajaran}</td><td>${n.nilai}</td></tr>`;
        totalNilai += n.nilai;
      });
      html += `</tbody></table>`;

      const rataRata = (totalNilai / nilai.length).toFixed(2);
      rataRataEl.textContent = `Rata-rata Nilai: ${rataRata}`;

      hasilDiv.innerHTML = html;
      modal.style.display = "block";
      overlay.style.display = "block";
    }

    // Menutup modal
    function closeModal() {
      document.getElementById("modal").style.display = "none";
      document.getElementById("overlay").style.display = "none";
