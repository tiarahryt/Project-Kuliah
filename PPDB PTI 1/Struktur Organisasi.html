<!DOCTYPE html>
<html lang="en">
<head>
    <title>Faktor Pendorong Perkembangan Kecerdasan Buatan</title>
</head>
    <style>
        body {
            background: whitesmoke;
        }
    </style>
<body>
    <div class="card-container">
        <div class="card">
            <div class="card-content">
                <img src="Image/20241204_135027_0000.png"  width="100%" height="auto">

            </div>
        </div>
    </div>

    <style>

        .card-container {
           display: flex;
           justify-content: center;
           flex-wrap: wrap;
           align-items: center;
           gap:25px;
           margin-top: 40px;
        }

        .card {
           display: flex;
           width: 1000px;
           height: 800px;
           background-color: #f4f4f4;
           border-radius: 10px;
           box-shadow: 0px 2px 4px rgba(0,0,0,1);
           overflow: hidden;
           transition: transform 0.6s ease;
         }
         .card:hover {
           transform: translateY(-20px);
         }

         .card video {
           width: 50%;
           height: auto;
           object-fit: cover;
           border: 2px black;
        }

        .card-content {
           padding: 20px;
        }
        .card-content h1{
           font-size: 24px;
           margin-bottom: 10px;
           text-align: center;
           top: 35%;
            left: 30%;
            background: linear-gradient(90deg,
            #ff0000,
            #ffff00,
            #ff00f3, #0033ff,
            #ff00c4, #ff0000);
            background-size: 400%;
            font-size: 45px;
            font-family: Arial, sans-serif;
            word-spacing: 5px;
            -webkit-text-fill-color: transparent;
            -webkit-background-clip: text;
            animation: animate 10s linear infinite;
        }
        @keyframes animate{
            0%{
                background-position: 0%;
            }
            100%{
                background-position: 400%;
            }

        }

        .card-content h2 {
            font-size: 24px;
            margin-bottom: 10px;
        }

        .card-content p{
           font-size: 15px;
           color: #666;
           margin-bottom: 20px;
           text-indent: 20px;
        }
        .card-content ul {
           font-size: 15px;
           margin-bottom: 15px;
        }
   </style>
</body>
</html>
