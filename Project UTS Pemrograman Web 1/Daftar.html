<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Developer di TH-Library.</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>

<body>
  <section class="daftar">
    <div class="container">
      <div class="contactForm">
        <div class="box">
          <div class="icon"></div>
          <h2>Hubungi Kami</h2>

          <form>
            <div class="inputBox"></div>
            <label for="nama lengkap">Nama Lengkap:</label><br>
            <input type="text" id="nama lengkap" name="nama lengkap" required><br>
            <label for="email">E-mail:</label><br>
            <input type="email" id="email" name="email" required><br>
            <label for="nomor">Nomor Telepon:</label><br>
            <input type="tel" id="nomor" name="nomor" pattern="[0-9]{10,13}" required><br>
            <label for="tanya">Pertanyaan:</label><br>
            <textarea id="tanya" name="tanya" rows="10" cols="50" required></textarea><br>
            <input type="button" value="Submit">
          </form>
          </form>
        </div>

</body>

</html>
